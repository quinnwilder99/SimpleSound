name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain

      - name: detekt
        run: ./gradlew detekt --console=plain

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Catches an @Entity change that didn't regenerate/commit the exported Room
      # schema JSON. A stale schema means migrations can't be reviewed or tested,
      # which is how an app update ends up crashing on launch or losing data.
      - name: Verify Room schema is up to date
        run: |
          ./gradlew :data:kspDebugKotlin --console=plain
          if ! git diff --exit-code -- data/schemas; then
            echo "::error::data/schemas/ is out of date. Run ./gradlew :data:kspDebugKotlin and commit the result, and add a Migration (see DEPLOY.md)."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          retention-days: 7
